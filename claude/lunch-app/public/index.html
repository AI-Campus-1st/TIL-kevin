<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘뭐먹지</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23ff385c'/><path d='M10 9v6a3 3 0 0 0 6 0V9M13 9v14M21 9c-2 0-3 3-3 6s1 3 3 3v5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 아이콘 스프라이트 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 32 32"><path d="M13 24a11 11 0 1 0 0-22 11 11 0 0 0 0 22zm8-3 9 9" fill="none" stroke="currentColor" stroke-width="4"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-logo" viewBox="0 0 32 32"><path d="M10 6v8a4 4 0 0 0 8 0V6M14 6v20M24 6c-2.5 0-4 3.5-4 8s1.5 4 4 4v8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="top-nav">
    <div class="nav-inner">
      <a class="wordmark" href="/" aria-label="오늘뭐먹지 홈">
        <svg class="wordmark-icon"><use href="#i-logo"/></svg>
        <span>오늘뭐먹지</span>
      </a>
      <a class="icon-button-outline" href="#history" aria-label="최근 먹은 메뉴로 이동" title="최근 먹은 메뉴">
        <svg><use href="#i-clock"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>오늘 점심, 어디서 뭐 먹을까요?</h1>

      <form class="search-bar" id="search-form" role="search" aria-label="추천 조건">
        <label class="segment">
          <span class="segment-label">지역</span>
          <select id="sido" aria-label="시/도">
            <option value="">시/도 선택</option>
          </select>
        </label>
        <span class="segment-divider" aria-hidden="true"></span>
        <label class="segment">
          <span class="segment-label">시/군/구</span>
          <select id="district" aria-label="시/군/구" disabled>
            <option value="">시/군/구 선택</option>
          </select>
        </label>
        <span class="segment-divider" aria-hidden="true"></span>
        <label class="segment">
          <span class="segment-label">예산</span>
          <select id="price" aria-label="최대 예산">
            <option value="">제한 없음</option>
            <option value="7000">7,000원 이하</option>
            <option value="10000">10,000원 이하</option>
            <option value="12000">12,000원 이하</option>
            <option value="15000">15,000원 이하</option>
          </select>
        </label>
        <span class="segment-divider" aria-hidden="true"></span>
        <label class="segment">
          <span class="segment-label">매운맛</span>
          <select id="spicy" aria-label="매운맛 허용 정도">
            <option value="">상관없음</option>
            <option value="1">살짝까지</option>
            <option value="0">안 매운 것만</option>
          </select>
        </label>
        <button type="submit" class="search-orb" id="recommend-btn" aria-label="메뉴 추천받기">
          <svg><use href="#i-search"/></svg>
          <span class="search-orb-text">메뉴 추천받기</span>
        </button>
      </form>

      <nav class="category-strip" id="category-strip" aria-label="음식 종류"></nav>

      <div class="mood" role="group" aria-label="오늘의 기분">
        <span class="mood-label">오늘의 기분</span>
        <div class="pills" id="tag-pills"></div>
      </div>
    </section>

    <div class="layout">
      <section class="detail-head" id="detail-head" aria-live="polite">
        <div class="photo-plate" id="photo-plate">
          <span class="badge hidden" id="photo-badge">오늘의 추천</span>
          <span class="photo-emoji" id="result-emoji">🍽️</span>
        </div>
        <h2 class="result-name" id="result-name">아직 고른 메뉴가 없어요</h2>
        <p class="result-meta" id="result-meta">지역과 조건을 고른 뒤 검색 버튼을 눌러 보세요.</p>
        <p class="result-reason hidden" id="result-reason"></p>
        <p class="result-note hidden" id="result-note"></p>
        <p class="error-text hidden" id="error" role="alert"></p>
      </section>

      <aside class="rail" aria-label="선택한 메뉴">
        <div class="reservation-card">
          <div class="rail-price" id="rail-price">
            <span class="rail-price-value">메뉴를 추천받아 보세요</span>
          </div>
          <dl class="rail-box">
            <div class="rail-cell">
              <dt>지역</dt>
              <dd id="rail-region">선택 안 함</dd>
            </div>
            <div class="rail-cell">
              <dt>메뉴</dt>
              <dd id="rail-menu">-</dd>
            </div>
          </dl>
          <button type="button" class="button-primary" id="eat-btn">메뉴 추천받기</button>
          <button type="button" class="button-secondary hidden" id="reroll-btn">
            <svg><use href="#i-refresh"/></svg>다시 추천
          </button>
          <a class="button-tertiary hidden" id="map-link" target="_blank" rel="noopener noreferrer">
            <svg><use href="#i-pin"/></svg>지도에서 더 찾아보기
          </a>
          <p class="rail-hint">최근 3번 먹은 메뉴는 추천에서 빠지고, 직전과 같은 종류는 덜 나와요.</p>
        </div>
      </aside>

      <div class="detail-body hidden" id="detail-body">
        <section class="section" id="alternatives">
          <h3>이런 메뉴는 어때요?</h3>
          <div class="alt-grid" id="alt-list"></div>
        </section>

        <section class="section" id="places">
          <h3 id="places-title">근처 식당</h3>
          <p class="places-status" id="places-status"></p>
          <ol class="places-list" id="places-list"></ol>
          <p class="places-source hidden" id="places-source"></p>
        </section>
      </div>

      <section class="section history" id="history" aria-label="최근 먹은 메뉴">
        <div class="history-header">
          <h3>최근 먹은 메뉴</h3>
          <button type="button" class="button-tertiary" id="clear-history">기록 지우기</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
      </section>
    </div>
  </main>

  <footer class="legal-band">
    <span>메뉴 가격은 1인 기준 대략적인 금액이에요.</span>
    <span>장소 정보 제공: 카카오맵 · 네이버 지도</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
